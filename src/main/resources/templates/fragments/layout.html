<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VET EXPERTS - Sistema de gestión veterinaria">
    <title th:text="${title} + ' | VET EXPERTS'">VET EXPERTS</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
</head>
<body>

<!-- ========== NAVBAR ========== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand navbar-brand-custom" th:href="@{/dashboard}">
            <img th:src="@{/img/logo.png}" alt="VET EXPERTS">
            <span>VET<span style="color: #f7b032;">Experts</span></span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
                        <i class="bi bi-house-door"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'propietarios'} ? 'active'" th:href="@{/propietarios}">
                        <i class="bi bi-people"></i> Propietarios
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <span class="user-badge">
                    <i class="bi bi-person-circle"></i>
                    <span th:text="${session.username}">Usuario</span>
                    <span class="badge-custom badge-admin" th:if="${session.rol == 'ADMIN'}" th:text="${session.rol}">ADMIN</span>
                    <span class="badge-custom badge-vet" th:if="${session.rol == 'VETERINARIO'}" th:text="${session.rol}">VET</span>
                </span>
                <a th:href="@{/auth/logout}" class="btn btn-logout btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- ========== FOOTER ========== -->
<footer th:fragment="footer" class="footer-custom">
    <div class="container">
        <p class="mb-0">&copy; 2026 <strong>VET EXPERTS</strong> — Lo mejor para tu mascota</p>
    </div>
</footer>

<!-- ========== SCRIPTS ========== -->
<div th:fragment="scripts">
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
